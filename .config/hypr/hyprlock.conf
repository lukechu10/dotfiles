general {
	ignore_empty_input = true
}

background {
	monitor =
	path = #
}

input-field {
	monitor =
	size = 400, 50
	outline_thickness = 3
	dots_size = 0.33
	dots_center = true
	dots_rounding = -1
	fade_on_empty = true
	placeholder_text = <i>Input Password...</i>
	hide_input = false
}

# Clock
label {
	monitor =
	text = cmd[update:1000] echo "$TIME"
	color = rgba(200, 200, 200, 1.0)
	font_size = 55
	position = -100, 70
	halign = right
	valign = bottom
	shadow_passes = 5
	shadow_size = 10
}

label {
	monitor =
	text = $USER
	color = rgba(200, 200, 200, 1.0)
	font_size = 20
	position = -100, 160
	halign = right
	valign = bottom
	shadow_passes = 5
	shadow_size = 10
}

background {
	monitor =
	path = ~/.config/hypr/wallpaper/wallpaper.jpg
	blur_size = 8
	blur_passes = 2
	vibrancy = 0.1696
	noise = 0.0117
}
