general {
	ignore_empty_input = true
}

background {
	monitor =
	path = ~/.config/hypr/wallpaper/wallpaper.jpg
	blur_size = 8
	blur_passes = 2
	vibrancy = 0.1696
	noise = 0.0117
}

input-field {
	monitor =
	size = 400, 50
	outline_thickness = 3
	dots_size = 0.25
	dots_spacing = 0.45
	dots_center = true
	dots_rounding = -1
	fade_on_empty = true
	placeholder_text = <i>Input Password...</i>
	hide_input = false
}

# Date
label {
	monitor =
	text = cmd[update:1000] echo "$(date +"%A, %d %B")"
	font_family = Fira Code Bold
	color = rgba(200, 200, 200, 1.0)
	font_size = 30
	position = 0, 400
	halign = center
	valign = center
	shadow_passes = 5
	shadow_size = 10
}

# Time
label {
	monitor =
	text = cmd[update:1000] echo "$(date +"%I:%M %p")"
	font_family = Fira Code Extrabold
	color = rgba(200, 200, 200, 1.0)
	font_size = 60
	position = 0, 300
	halign = center
	valign = center
	shadow_passes = 5
	shadow_size = 10
}

# User
label {
	monitor =
	text = Welcome back, $USER
	font_family = Fira Code Bold
	color = rgba(200, 200, 200, 1.0)
	font_size = 20
	position = 0, 100
	halign = center
	valign = center
	shadow_passes = 5
	shadow_size = 10
}
